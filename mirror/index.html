<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Mirror</title>
<meta name="description" content="A tap-to-reveal note for the mirror — a fresh line every time, cycling through without repeats.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ink: #211823;
    --ink-2: #2c2130;
    --ink-3: #37283c;
    --paper: #f6ece4;
    --paper-dim: #cdbdc4;
    --accent: #e3a34e;
    --accent-soft: #c97b9c;
    --muted: #9c8a97;
    --line: rgba(246,236,228,0.14);
  }

  *{ box-sizing:border-box; }

  html{
    background: var(--ink);
  }

  body{
    background: var(--ink);
    color: var(--paper);
    min-height:100vh;
    margin:0;
    font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6vh 5vw;
    overflow-x:hidden;
    position:relative;
  }

  /* dawn glow behind the mirror */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(60% 50% at 50% 22%, rgba(227,163,78,0.20), transparent 65%),
      radial-gradient(70% 55% at 50% 88%, rgba(201,123,156,0.14), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .frame{
    position:relative;
    z-index:1;
    width:100%;
    max-width:30rem;
    text-align:center;
  }

  .glass{
    background: linear-gradient(180deg, var(--ink-2), var(--ink-3));
    border:1px solid var(--line);
    border-radius: 1.75rem;
    padding: 3.25rem 2.25rem 2.5rem;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 30px 60px -30px rgba(0,0,0,0.6);
    opacity:0;
    transform: translateY(6px);
    animation: rise 1.1s cubic-bezier(.2,.7,.3,1) forwards;
  }

  @keyframes rise{
    to{ opacity:1; transform:none; }
  }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 1.4rem;
  }

  .note{
    font-family:'Fraunces', Georgia, 'Iowan Old Style', serif;
    font-optical-sizing:auto;
    font-weight: 420;
    font-size: clamp(1.5rem, 4.6vw, 2.05rem);
    line-height: 1.42;
    letter-spacing: 0.002em;
    text-wrap: balance;
    color: var(--paper);
    margin: 0;
    min-height: 7.5em;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .35s ease;
  }

  .note.turning{ opacity: 0; }

  .rule{
    width: 2.25rem;
    height:1px;
    background: var(--line);
    margin: 1.9rem auto 1.35rem;
  }

  .sign{
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    font-family:'Fraunces', Georgia, serif;
  }

  .again{
    appearance:none;
    background:none;
    border:none;
    color: var(--accent-soft);
    font-family:'Archivo', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform:uppercase;
    font-weight:600;
    margin-top: 2.1rem;
    padding: 0.6rem 0.4rem;
    cursor:pointer;
    opacity:0.85;
  }
  .again:hover{ opacity:1; color:var(--accent); }
  .again:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce){
    .glass{ animation:none; opacity:1; transform:none; }
    .note{ transition:none; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="glass">
    <p class="eyebrow">This morning</p>
    <p class="note" id="note">Loading…</p>
    <div class="rule"></div>
    <p class="sign" id="sign">— for you</p>
    <button class="again" id="again" type="button">One more →</button>
  </div>
</div>

<script>
  var NOTES = [
    "You make ordinary mornings feel like they're worth getting up for.",
    "I don't say it enough: you're the best part of my day, every single day.",
    "Whatever's on your plate today, you've got this. You always do.",
    "I love the way your face changes right before you laugh at your own joke.",
    "Somewhere out there, past-me is really glad I walked up and said hi.",
    "You're the person I want to tell things to first. Still. Always.",
    "Today's forecast: mostly you, with a chance of me showing up with your favorite snack.",
    "I noticed. Whatever it was you did that you thought no one saw — I noticed.",
    "You handle hard days better than you give yourself credit for.",
    "If I had to pick this same life again, I'd pick the version with you in it.",
    "Go be brilliant today. I'll be here when you're done.",
    "You are, annoyingly, always right about how long the coffee actually takes to cool.",
    "I like you more today than the day I met you, and I liked you a lot that day.",
    "Whatever this mirror says, the real one's better looking.",
    "Someone out there is lucky to know you. That's me. I'm someone.",
    "You're allowed to have an easy day too, you know.",
    "I saved you the last of the good snacks. Don't tell anyone.",
    "Your bad jokes are, objectively, the best bad jokes I've ever heard.",
    "Take the compliment. You worked hard for it.",
    "You make hard things feel a little more possible, just by being around.",
    "I'm proud of you, for reasons you probably don't think are a big deal. They are.",
    "Drink some water. Also, you're wonderful. Both things are true.",
    "You have the kind of laugh that makes other people start laughing too.",
    "Even on your worst day, you're still someone's favorite person. Mine.",
    "This is your sign to be a little kinder to yourself today.",
    "I like our life. I like it a lot. Thanks for building it with me.",
    "You're doing better than you think you are.",
    "One day I'll stop being obvious about how much I like you. Today is not that day."
  ];

  // Namespaced for this page: every future tag page should prefix its own
  // localStorage keys the same way, since GitHub Pages serves all pages
  // from one shared origin (unlike the old per-artifact isolated origins).
  var DECK_KEY = 'mm_deck';

  function loadDeck(){
    try{
      var raw = localStorage.getItem(DECK_KEY);
      var deck = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(deck) || deck.length === 0) deck = reshuffle();
      return deck;
    } catch(e){ return shuffled(NOTES.map(function(_,i){return i;})); }
  }

  function shuffled(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function reshuffle(){
    var deck = shuffled(NOTES.map(function(_,i){return i;}));
    try{ localStorage.setItem(DECK_KEY, JSON.stringify(deck)); } catch(e){}
    return deck;
  }

  function draw(){
    var deck = loadDeck();
    var idx = deck.shift();
    if (deck.length === 0) deck = reshuffle();
    try{ localStorage.setItem(DECK_KEY, JSON.stringify(deck)); } catch(e){}
    return NOTES[idx];
  }

  var noteEl = document.getElementById('note');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(first){
    var text = draw();
    if (first || reduce){
      noteEl.textContent = text;
      return;
    }
    noteEl.classList.add('turning');
    setTimeout(function(){
      noteEl.textContent = text;
      noteEl.classList.remove('turning');
    }, 220);
  }

  show(true);
  document.getElementById('again').addEventListener('click', function(){ show(false); });
</script>
</body>
</html>
